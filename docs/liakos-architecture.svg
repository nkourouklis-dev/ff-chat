<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b7fb8"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c5cff"/>
    </marker>
  </defs>

  <rect width="1180" height="800" fill="#140f2e"/>

  <text x="40" y="52" fill="#ffffff" font-size="30" font-weight="800">Liakos Chat — Αρχιτεκτονική</text>
  <text x="40" y="78" fill="#8b7fb8" font-size="15">v1.3.0 · Cloudflare Workers + Durable Objects + D1 + R2 + Workers AI</text>

  <!-- CLIENTS -->
  <rect x="40" y="110" width="230" height="230" rx="24" fill="#ffffff0d" stroke="#ffffff26"/>
  <text x="60" y="142" fill="#8b7fb8" font-size="13" font-weight="700" letter-spacing="1">ΧΡΗΣΤΕΣ</text>

  <rect x="62" y="158" width="186" height="76" rx="16" fill="#7c5cff26" stroke="#7c5cff66"/>
  <text x="80" y="188" font-size="24">📱</text>
  <text x="112" y="184" fill="#fff" font-size="15" font-weight="700">Κινητό</text>
  <text x="112" y="204" fill="#a99fd0" font-size="12">PWA στο Home Screen</text>
  <text x="80" y="222" fill="#a99fd0" font-size="12">Safari / Chrome</text>

  <rect x="62" y="246" width="186" height="72" rx="16" fill="#ffffff0d" stroke="#ffffff26"/>
  <text x="80" y="276" font-size="22">💻</text>
  <text x="112" y="272" fill="#fff" font-size="15" font-weight="700">Υπολογιστής</text>
  <text x="80" y="300" fill="#a99fd0" font-size="12">απλός browser</text>

  <!-- CLOUDFLARE BOX -->
  <rect x="330" y="110" width="810" height="640" rx="26" fill="#f6821f0f" stroke="#f6821f4d" stroke-dasharray="7 6"/>
  <text x="356" y="142" fill="#f6821f" font-size="14" font-weight="800" letter-spacing="1">CLOUDFLARE EDGE</text>

  <!-- PAGES -->
  <rect x="356" y="162" width="230" height="120" rx="20" fill="#ffffff12" stroke="#ffffff33"/>
  <text x="376" y="192" fill="#fff" font-size="16" font-weight="800">Cloudflare Pages</text>
  <text x="376" y="214" fill="#a99fd0" font-size="12.5">React 18 + Vite + Tailwind</text>
  <text x="376" y="233" fill="#a99fd0" font-size="12.5">SPA · react-router · PWA</text>
  <text x="376" y="252" fill="#a99fd0" font-size="12.5">8 pages · services/api.ts</text>
  <text x="376" y="271" fill="#6ee7a8" font-size="12">static · _redirects → index.html</text>

  <!-- WORKER -->
  <rect x="640" y="162" width="240" height="120" rx="20" fill="#f6821f2e" stroke="#f6821f99" stroke-width="2"/>
  <text x="660" y="192" fill="#fff" font-size="16" font-weight="800">Worker (Hono)</text>
  <text x="660" y="214" fill="#e8c9a8" font-size="12.5">REST API · 21 routes</text>
  <text x="660" y="233" fill="#e8c9a8" font-size="12.5">HMAC auth · CORS</text>
  <text x="660" y="252" fill="#e8c9a8" font-size="12.5">media proxy (Range)</text>
  <text x="660" y="271" fill="#ffb865" font-size="12">stateless · worker/index.ts</text>

  <!-- DO -->
  <rect x="640" y="330" width="240" height="122" rx="20" fill="#7c5cff33" stroke="#7c5cff" stroke-width="2"/>
  <text x="660" y="360" fill="#fff" font-size="16" font-weight="800">Durable Object</text>
  <text x="660" y="380" fill="#fff" font-size="13" font-weight="700">ChatRoom</text>
  <text x="660" y="401" fill="#c7bdf0" font-size="12.5">1 instance ανά roomId</text>
  <text x="660" y="420" fill="#c7bdf0" font-size="12.5">WebSocket hibernation</text>
  <text x="660" y="439" fill="#c7bdf0" font-size="12.5">fan-out · presence · edit</text>

  <!-- AI -->
  <rect x="930" y="162" width="185" height="120" rx="20" fill="#38bdf826" stroke="#38bdf880"/>
  <text x="950" y="192" fill="#fff" font-size="16" font-weight="800">Workers AI</text>
  <text x="950" y="214" fill="#a5d8f0" font-size="12">Llama 4 Scout</text>
  <text x="950" y="232" fill="#a5d8f0" font-size="12">17B · 16 experts</text>
  <text x="950" y="255" fill="#7dd3fc" font-size="12">«ο Λιάκος»</text>
  <text x="950" y="272" fill="#7dd3fc" font-size="12">+ memory extraction</text>

  <!-- STORAGE ROW -->
  <text x="356" y="520" fill="#8b7fb8" font-size="13" font-weight="700" letter-spacing="1">ΑΠΟΘΗΚΕΥΣΗ</text>

  <rect x="356" y="536" width="330" height="180" rx="20" fill="#10b98126" stroke="#10b98180"/>
  <text x="378" y="566" fill="#fff" font-size="16" font-weight="800">D1 — liakos_db (SQLite)</text>
  <text x="378" y="592" fill="#9fe0c4" font-size="12.5">users · rooms · room_members</text>
  <text x="378" y="612" fill="#9fe0c4" font-size="12.5">messages (edited_at, deleted_at)</text>
  <text x="378" y="632" fill="#9fe0c4" font-size="12.5">updates (expires_at +24h)</text>
  <text x="378" y="652" fill="#9fe0c4" font-size="12.5">room_reads · user_memory</text>
  <text x="378" y="672" fill="#6b8f7e" font-size="12.5">game_sessions (αχρησιμοποίητο)</text>
  <text x="378" y="698" fill="#5eead4" font-size="12">5 migrations</text>

  <rect x="710" y="536" width="230" height="180" rx="20" fill="#f4728226" stroke="#f4728280"/>
  <text x="732" y="566" fill="#fff" font-size="16" font-weight="800">R2 — liakos-media</text>
  <text x="732" y="592" fill="#f7b3bd" font-size="12.5">video updates</text>
  <text x="732" y="612" fill="#f7b3bd" font-size="12.5">key: userId/uuid.webm</text>
  <text x="732" y="632" fill="#f7b3bd" font-size="12.5">χωρίς egress κόστος</text>
  <text x="732" y="662" fill="#fb7185" font-size="12">⚠ κανένα cleanup</text>
  <text x="732" y="680" fill="#fb7185" font-size="12">ληγμένων αρχείων</text>

  <!-- CI/CD -->
  <rect x="964" y="536" width="151" height="180" rx="20" fill="#ffffff0d" stroke="#ffffff26"/>
  <text x="984" y="566" fill="#fff" font-size="15" font-weight="800">CI/CD</text>
  <text x="984" y="592" fill="#a99fd0" font-size="12">GitHub Actions</text>
  <text x="984" y="611" fill="#a99fd0" font-size="12">push → main</text>
  <text x="984" y="636" fill="#a99fd0" font-size="12">wrangler-action</text>
  <text x="984" y="655" fill="#a99fd0" font-size="12">deploy Worker</text>
  <text x="984" y="674" fill="#a99fd0" font-size="12">+ deploy Pages</text>
  <text x="984" y="699" fill="#6ee7a8" font-size="12">tag v1.3.0</text>

  <!-- ARROWS -->
  <path d="M270 210 L350 210" stroke="#8b7fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="272" y="200" fill="#8b7fb8" font-size="11.5">HTTPS</text>

  <path d="M270 282 C 310 282, 316 300, 340 300 L 340 470 L 630 470 L 630 400 L 634 400"
        stroke="#7c5cff" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#av)"/>
  <text x="352" y="462" fill="#7c5cff" font-size="12" font-weight="700">WebSocket /ws/:roomId (token στο query)</text>

  <path d="M586 222 L634 222" stroke="#8b7fb8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="560" y="308" fill="#8b7fb8" font-size="11.5">fetch REST + Bearer</text>

  <path d="M880 222 L924 222" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <path d="M760 288 L760 324" stroke="#f6821f" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="770" y="312" fill="#f6821f" font-size="11.5">upgrade 101 → stub.fetch</text>

  <path d="M700 458 L620 458 L620 530" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="500" y="452" fill="#10b981" font-size="11.5">INSERT messages</text>

  <path d="M700 292 C 640 292, 560 400, 560 530" stroke="#10b981" stroke-width="1.8" fill="none" marker-end="url(#a)" opacity="0.65"/>
  <path d="M820 292 C 830 400, 825 460, 825 530" stroke="#f47282" stroke-width="1.8" fill="none" marker-end="url(#a)" opacity="0.75"/>
  <text x="836" y="500" fill="#f47282" font-size="11.5">put / get</text>

  <!-- NOTE -->
  <rect x="40" y="380" width="230" height="336" rx="20" fill="#ffffff0a" stroke="#ffffff1a"/>
  <text x="60" y="412" fill="#8b7fb8" font-size="13" font-weight="700" letter-spacing="1">ΚΡΙΣΙΜΑ ΣΗΜΕΙΑ</text>
  <text x="60" y="442" fill="#fff" font-size="12.5" font-weight="700">1. Το /ws route μπαίνει</text>
  <text x="60" y="460" fill="#a99fd0" font-size="12">πάνω από το CORS — τα</text>
  <text x="60" y="477" fill="#a99fd0" font-size="12">headers του 101 είναι</text>
  <text x="60" y="494" fill="#a99fd0" font-size="12">immutable.</text>

  <text x="60" y="524" fill="#fff" font-size="12.5" font-weight="700">2. Ο Worker είναι</text>
  <text x="60" y="542" fill="#a99fd0" font-size="12">stateless. Μόνο το DO</text>
  <text x="60" y="559" fill="#a99fd0" font-size="12">κρατάει sockets.</text>

  <text x="60" y="589" fill="#fff" font-size="12.5" font-weight="700">3. VITE_API_BASE_URL</text>
  <text x="60" y="607" fill="#a99fd0" font-size="12">μπαίνει σε build time.</text>
  <text x="60" y="624" fill="#a99fd0" font-size="12">Αλλαγή = νέο build.</text>

  <text x="60" y="654" fill="#fb7185" font-size="12.5" font-weight="700">4. Το login φτιάχνει</text>
  <text x="60" y="672" fill="#fb7185" font-size="12">πάντα ΝΕΟ χρήστη —</text>
  <text x="60" y="689" fill="#fb7185" font-size="12">δεν ξανασυνδέεσαι στον</text>
  <text x="60" y="706" fill="#fb7185" font-size="12">ίδιο λογαριασμό.</text>

  <text x="40" y="775" fill="#6b6394" font-size="12">Νίκος Κουρουκλής · nkourouklis-dev/liakos-chat · Σεπτέμβριος 2026</text>
</svg>
